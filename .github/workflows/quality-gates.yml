name: Quality Gates

on:
  push:
    branches: ["main", "develop", "feature/**", "ci-**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # JOB 1: BACKEND QUALITY GATES (PHP/Laravel + Vite Build)
  # ==================================================================
  backend-quality:
    name: Backend Quality (PHP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_pgsql
          coverage: xdebug

      # Necesitamos Node para generar el manifest.json de Vite para los tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm install
          npm run build

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: "Gate 1: Code Style (Laravel Pint)"
        run: ./vendor/bin/pint --test

      - name: Setup Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: "Gate 2: Security Audit (Composer)"
        run: composer audit

      # Los tests ahora funcionarán porque 'npm run build' ya se ejecutó
      - name: "Gate 3: PHPUnit Tests with Coverage"
        run: |
          php artisan test --coverage-text --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
